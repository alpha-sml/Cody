name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup
        run: make setup

      - name: Run tests
        run: make test

      - name: Smoke test (make run with mock)
        run: |
          export AI_API_KEY="ci-test-key"
          export MOCK_MODEL=true
          echo "Fix the authentication flow" | make run
